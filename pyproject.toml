[project]
name = "better-axi"
version = "0.1.0"
description = "High-throughput extractor bridge and workflows uniting AXI, PAG Decisions, and Crawl4AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai>=0.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
